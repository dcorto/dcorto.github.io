<!-- seo improvements -->
{{ with .Params.seo.disallowrobots }}<meta name="robots" content="noindex, nofollow, noarchive">{{ else }}<meta name="robots" content="index, follow, archive">{{ end }}

<!-- favicon stuff -->
<link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png">
<link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png">
<link rel="manifest" href="/site.webmanifest">

<!-- rss -->
{{ with .OutputFormats.Get "rss" }}
{{ printf `<link rel=%q type=%q href=%q title=%q>` .Rel .MediaType.Type .Permalink site.Title | safeHTML }}
{{ end }}

{{ if hugo.IsProduction }}
<!-- umami analytics -->
<script defer src="https://umami.arpaneting.es/script.js" data-website-id="903104e5-b6ee-4fa3-9cb8-58d23e9639b0"></script>{{ end }}
<link rel="me" href="https://masto.es/@davidcorto">
